services:
  servidor:
    build:
      context: ./servidor3
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    environment:
      DB_HOST: ${DB_HOST:?Define DB_HOST en el archivo .env}
      DB_PORT: ${DB_PORT:?Define DB_PORT en el archivo .env}
      DB_USER: ${DB_USER:?Define DB_USER en el archivo .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      DB_NAME: ${DB_NAME:?Define DB_NAME en el archivo .env}
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el archivo .env}
      NAVEW_FRONTEND_ORIGIN: ${NAVEW_FRONTEND_ORIGIN:?Define NAVEW_FRONTEND_ORIGIN en el archivo .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: ${DB_HOST:?Define DB_HOST en el archivo .env}
      PMA_PORT: ${DB_PORT:?Define DB_PORT en el archivo .env}
      PMA_ARBITRARY: 1
    ports:
      - 8081:80

  maestro1:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: F4rb10PH4rm4
      MYSQL_DATABASE: db_informacion
    ports:
      - 3406:3306
    command: --server-id=1 --log-bin=mysql-bin --binlog-do-db=db_informacion
    volumes:
      - ./maestro1/init:/docker-entrypoint-initdb.d
      - ./maestro1/conf.d:/etc/mysql/conf.d

  esclavo:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: F4rb10PH4rm4
      MYSQL_DATABASE: db_informacion
    ports:
      - 3307:3306
    command: --server-id=2 --log-bin=mysql-bin --binlog-do-db=db_informacion


