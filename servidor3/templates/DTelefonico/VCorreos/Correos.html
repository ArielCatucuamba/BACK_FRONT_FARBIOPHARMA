<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Correos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/directory-theme.css') }}">
</head>

<body data-directory-page="correos">
    <div class="directory-layout">
        <nav class="sidebar" aria-label="Navegación del directorio">
            <div class="logo">
                <img src="/static/images/logo_Farbiopharma.png" alt="Farbiopharma">
            </div>
            <ul class="menu-list">
                <li><button class="menu-btn" onclick="location.href='/vextensiones'" type="button"><i
                            class="bi bi-telephone"></i> Extensiones</button></li>
                <li><button class="menu-btn" onclick="location.href='/vcelulares'" type="button"><i
                            class="bi bi-phone"></i> Celulares</button></li>
                <li><button class="menu-btn active" onclick="location.href='/vcorreos'" type="button"><i
                            class="bi bi-envelope"></i> Correos </button></li>
                <li><button class="menu-btn" onclick="location.href='/login'" type="button"><i
                            class="bi bi-person-circle"></i> Iniciar sesión</button></li>
            </ul>
        </nav>
        <main class="directory-content">
            <header class="directory-page-header">
                <div class="header-icon" aria-hidden="true"><i class="bi bi-envelope-fill"></i></div>
                <div>
                    <h1>Directorio de Correos</h1>
                    <p>Consulta las direcciones de correo del personal.</p>
                </div>
            </header>
            <section class="directory-filter-card" aria-label="Filtros de correos">
                <div class="input-group directory-search">
                    <span class="input-group-text" aria-hidden="true"><i class="bi bi-search"></i></span>
                    <input type="search" id="filtroNombre" class="form-control" placeholder="Buscar por nombre o correo..." aria-label="Buscar correos" data-filter="search">
                </div>
                <select id="filtroDepartamento" class="form-select" aria-label="Filtrar por departamento" data-filter="department">
                    <option value="">Todos los departamentos</option>
                    {% set deps_unicos = correos | map(attribute=4) | unique | list %}
                    {% for dep in deps_unicos %}
                        {% if dep %}<option value="{{ dep }}">{{ dep }}</option>{% endif %}
                    {% endfor %}
                </select>
                <select id="filtroArea" class="form-select" aria-label="Filtrar por área" data-filter="area">
                    <option value="">Todas las áreas</option>
                    {% set areas_unicas = correos | map(attribute=3) | unique | list %}
                    {% for area in areas_unicas %}
                        {% if area %}<option value="{{ area }}">{{ area }}</option>{% endif %}
                    {% endfor %}
                </select>
            </section>
            <section class="directory-table-card" aria-label="Listado de correos">
                <div class="directory-table-wrap">
                    <table class="table directory-table">
                        <thead>
                            <tr>
                                <th scope="col">Nombre</th>
                                <th scope="col">Correo</th>
                                <th scope="col">Área</th>
                                <th scope="col">Departamento</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCorreos">
                            {% for correo in correos %}
                            <tr>
                                <td class="cor-nombre">{{ correo[1] }}</td>
                                <td class="cor-correo">{{ correo[2] }}</td>
                                <td class="cor-area">{{ correo[3] }}</td>
                                <td class="cor-departamento">{{ correo[4] }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                <footer class="directory-table-footer">
                    <p class="directory-results-count" data-pagination="summary" aria-live="polite"></p>
                    <nav class="directory-pagination" data-pagination="controls" aria-label="Paginación de correos"></nav>
                </footer>
                <p class="directory-no-results" role="status" aria-live="polite" hidden></p>
            </section>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/directory-filters.js') }}"></script>
</body>

</html>
