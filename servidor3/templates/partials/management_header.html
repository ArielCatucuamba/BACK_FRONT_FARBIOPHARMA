{% set nombre_mostrado = session.get('display_name') or session.get('username') or 'Usuario' %}
{% from 'partials/csrf_field.html' import csrf_field %}
<header class="management-header{% if header_context|default(false) %} management-header--context{% endif %}" aria-label="Cabecera de sesión">
    <details class="management-header__user" data-menu-usuario>
        <summary class="management-header__trigger" aria-label="Opciones de usuario" title="Opciones de usuario">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <circle cx="12" cy="9" r="3" />
                <path d="M5.5 18c1-3 3.1-4.5 6.5-4.5s5.5 1.5 6.5 4.5" />
            </svg>
        </summary>
        <nav class="management-header__panel" aria-label="Opciones de la sesión">
            <div class="management-header__identity">
                <span class="management-header__welcome">Bienvenido,</span>
                <span class="management-header__name">{{ nombre_mostrado }}</span>
            </div>
            <form method="POST" action="{{ url_for('auth.logout') }}" target="_top">
                {{ csrf_field(csrf_token_value) }}
                <input type="hidden" name="destino" value="directorio">
                <button class="management-header__action" type="submit" title="Cerrar sesión y abrir el directorio de extensiones">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="5" y="3" width="15" height="18" rx="2" /><path d="M3 7h4M3 12h4M3 17h4M11 9h5M11 13h5" />
                    </svg>
                    <span>Ir al directorio</span>
                </button>
            </form>
            <form method="POST" action="{{ url_for('auth.logout') }}" target="_top">
                {{ csrf_field(csrf_token_value) }}
                <button class="management-header__action" type="submit">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M10 17l5-5-5-5M15 12H3M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
                    </svg>
                    <span>Cerrar sesión</span>
                </button>
            </form>
        </nav>
    </details>
</header>
<script src="{{ url_for('static', filename='js/menuUsuario.js', v='1') }}" defer></script>
