<style>
	#modalDetalleColaborador .modal-dialog {
		max-width: 760px;
	}

	#modalDetalleColaborador .modal-content {
		overflow: hidden;
		border: 1px solid #e3edf2;
		border-radius: 24px;
		background: #fff;
		box-shadow: 0 24px 70px rgba(13, 59, 78, .2);
	}

	#modalDetalleColaborador .modal-header {
		padding: 1.25rem 1.5rem .75rem;
		border: 0;
	}

	#modalDetalleColaborador .modal-body {
		padding: .75rem 1.5rem 1.5rem;
	}

	#modalDetalleColaborador .detail-profile {
		display: flex;
		align-items: center;
		gap: 1rem;
		padding: .75rem .25rem 1.25rem;
	}

	#modalDetalleColaborador .detail-avatar {
		display: grid;
		width: 76px;
		height: 76px;
		flex: 0 0 76px;
		place-items: center;
		border: 4px solid #fff;
		border-radius: 50%;
		background: linear-gradient(145deg, #dff2f4, #c6e2e7);
		box-shadow: 0 4px 16px rgba(13, 59, 78, .14);
		color: #0d3b4e;
		font-size: 2rem;
	}

	#modalDetalleColaborador .detail-name {
		margin: 0 0 .4rem;
		color: #123f56;
		font-size: clamp(1.35rem, 4vw, 1.8rem);
		font-weight: 750;
		letter-spacing: -.035em;
		line-height: 1.15;
	}

	#modalDetalleColaborador .detail-meta {
		display: flex;
		flex-wrap: wrap;
		gap: .45rem 1rem;
		color: #607685;
		font-size: .9rem;
	}

	#modalDetalleColaborador .detail-meta span {
		display: inline-flex;
		align-items: center;
		gap: .4rem;
	}

	#modalDetalleColaborador .detail-section {
		margin-top: .85rem;
		padding: .4rem 1.1rem;
		border: 1px solid #e8eff3;
		border-radius: 15px;
		background: #f7fafc;
	}

	#modalDetalleColaborador .detail-section-title {
		margin: .45rem 0 .2rem;
		color: #0d3b4e;
		font-size: .72rem;
		font-weight: 750;
		letter-spacing: .09em;
		text-transform: uppercase;
	}

	#modalDetalleColaborador .detail-row {
		display: grid;
		grid-template-columns: minmax(135px, .85fr) minmax(0, 1.15fr);
		align-items: center;
		gap: 1rem;
		min-height: 43px;
		padding: .55rem 0;
		border-bottom: 1px solid #e7edf1;
		font-size: .9rem;
	}

	#modalDetalleColaborador .detail-row:last-child {
		border-bottom: 0;
	}

	#modalDetalleColaborador .detail-label {
		color: #657987;
	}

	#modalDetalleColaborador .detail-value {
		min-width: 0;
		color: #203b4b;
		font-weight: 600;
		overflow-wrap: anywhere;
	}

	#modalDetalleColaborador .detail-chip {
		display: inline-flex;
		max-width: 100%;
		padding: .28rem .65rem;
		border-radius: 7px;
		background: #e4f0f4;
		color: #174a60;
		font-weight: 650;
	}

	#modalDetalleColaborador .detail-chip--status {
		border-radius: 999px;
		background: #d8f1e2;
		color: #23623d;
	}

	#modalDetalleColaborador .modal-footer {
		padding: 0 1.5rem 1.35rem;
		border: 0;
	}

	#modalDetalleColaborador .btn-detail-close {
		min-width: 110px;
		border-radius: 9px;
		background: #0d3b4e;
		font-weight: 650;
	}

	@media (max-width: 575.98px) {
		#modalDetalleColaborador .modal-dialog { margin: .75rem; }
		#modalDetalleColaborador .modal-header { padding: 1rem 1rem .5rem; }
		#modalDetalleColaborador .modal-body { padding: .5rem 1rem 1rem; }
		#modalDetalleColaborador .modal-footer { padding: 0 1rem 1rem; }
		#modalDetalleColaborador .detail-profile { gap: .75rem; }
		#modalDetalleColaborador .detail-avatar { width: 62px; height: 62px; flex-basis: 62px; font-size: 1.6rem; }
		#modalDetalleColaborador .detail-section { padding-inline: .8rem; }
		#modalDetalleColaborador .detail-row { grid-template-columns: minmax(100px, .8fr) minmax(0, 1.2fr); gap: .5rem; font-size: .84rem; }
	}
</style>

<div class="modal fade" id="modalDetalleColaborador" tabindex="-1" aria-labelledby="modalDetalleColaboradorLabel" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<h2 class="visually-hidden" id="modalDetalleColaboradorLabel">Detalle del colaborador</h2>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
			</div>
			<div class="modal-body">
				<header class="detail-profile">
					<div class="detail-avatar" aria-hidden="true"><i class="bi bi-person-fill"></i></div>
					<div class="min-w-0">
						<h3 class="detail-name" id="detalleNombreEncabezado">Colaborador</h3>
						<div class="detail-meta">
							<span><i class="bi bi-briefcase" aria-hidden="true"></i><span id="detalleCargo">No registrado</span></span>
							<span><i class="bi bi-geo-alt" aria-hidden="true"></i><span id="detalleUbicacion">No registrada</span></span>
						</div>
					</div>
				</header>

				<section class="detail-section" aria-label="Asignación organizacional">
					<h4 class="detail-section-title">Asignación</h4>
					<div class="detail-row"><span class="detail-label">Empresa</span><span class="detail-value"><span class="detail-chip" id="detalleEmpresa">No registrada</span></span></div>
					<div class="detail-row"><span class="detail-label">Área</span><span class="detail-value" id="detalleArea">No registrada</span></div>
					<div class="detail-row"><span class="detail-label">Departamento</span><span class="detail-value" id="detalleDepartamento">No registrado</span></div>
				</section>

				<section class="detail-section" aria-label="Información personal y contacto">
					<h4 class="detail-section-title">Información personal</h4>
					<div class="detail-row"><span class="detail-label">ID de colaborador</span><span class="detail-value" id="detalleId">—</span></div>
					<div class="detail-row"><span class="detail-label">Cédula</span><span class="detail-value" id="detalleCedula">No registrada</span></div>
					<div class="detail-row"><span class="detail-label">Correo principal</span><span class="detail-value" id="detalleCorreo">No registrado</span></div>
					<div class="detail-row"><span class="detail-label">Estado</span><span class="detail-value"><span class="detail-chip detail-chip--status" id="detalleEstado">No registrado</span></span></div>
				</section>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-primary btn-detail-close" data-bs-dismiss="modal">Cerrar</button>
			</div>
		</div>
	</div>
</div>

<script>
	document.getElementById('modalDetalleColaborador').addEventListener('show.bs.modal', function (event) {
		const boton = event.relatedTarget;
		if (!boton) return;

		const campos = {
			Id: 'id',
			Cedula: 'cedula',
			Nombre: 'nombre',
			Empresa: 'empresa',
			Cargo: 'cargo',
			Area: 'area',
			Departamento: 'departamento',
			Ubicacion: 'ubicacion',
			Estado: 'estado',
			Correo: 'correo'
		};

		Object.entries(campos).forEach(function ([campo, atributo]) {
			const elemento = document.getElementById('detalle' + campo);
			if (elemento) elemento.textContent = boton.dataset[atributo] || 'No registrado';
		});
		document.getElementById('detalleNombreEncabezado').textContent = boton.dataset.nombre || 'Colaborador';
	});
</script>
