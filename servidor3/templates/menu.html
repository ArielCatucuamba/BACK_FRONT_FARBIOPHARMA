<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: #f3f6fa;
            min-height: 100vh;
            margin: 0;
        }
        .main-container {
            display: flex;
            min-height: 100vh;
            align-items: stretch;
            gap: 0;
            padding: 0;
        }
        .sidebar {
            background: #0d3b4e;
            border-radius: 0;
            width: 250px;
            min-width: 250px;
            padding: 1.25rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            box-shadow: 0 8px 28px rgba(13, 59, 78, 0.18);
            border: 0;
            height: 100vh;
            position: sticky;
            top: 0;
        }
        .brand {
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: .02em;
            padding: .4rem .6rem 1.1rem;
        }
        .sidebar .logout-btn {
            background: #0d3b4e;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.65rem 1rem;
            font-weight: 600;
            font-size: .95rem;
            margin-bottom: 1rem;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(13, 59, 78, 0.08);
            transition: background 0.2s;
        }
        .sidebar .logout-btn:hover {
            background: #14506b;
        }
        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
            overflow-y: auto;
        }
        .menu-list li {
            margin-bottom: 5px;
        }
        .menu-btn {
            width: 100%;
            background: none;
            border: none;
            text-align: left;
            padding: 10px 12px;
            font-size: .95rem;
            color: #fff;
            border-radius: 8px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.2s, color 0.2s;
        }
        .menu-btn.active,
        .menu-btn:hover {
            background: #14506b;
            color: #fff;
        }
        .workspace {
            flex: 1;
            min-width: 0;
            height: 100vh;
            overflow: hidden;
            background: #fff;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }
        .module-frame {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 600px;
            border: 0;
            background: #fff;
        }
        @media (max-width: 800px) {
            .main-container { gap: 0; padding: 0; }
            .sidebar { width: 190px; min-width: 190px; padding: .85rem .65rem; height: 100vh; top: 0; }
            .workspace { height: 100vh; }
            .menu-btn { padding: 9px 8px; font-size: .85rem; }
        }
        @media (max-width: 560px) {
            .main-container { flex-direction: column; }
            .sidebar { position: static; width: 100%; min-width: 0; height: auto; }
            .menu-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 6px; }
            .workspace { height: 75vh; }
            .module-frame { min-height: 75vh; }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="sidebar">
            <ul class="menu-list">
                <li><button class="menu-btn active" data-url="/crud_areas" type="button"><i class="bi bi-diagram-3"></i> Áreas</button></li>
                <li><button class="menu-btn" data-url="/departamentos" type="button"><i class="bi bi-building"></i> Departamentos</button></li>
                <li><button class="menu-btn" data-url="/crud_cargos" type="button"><i class="bi bi-person-badge"></i> Cargos</button></li>
                <li><button class="menu-btn" data-url="/ubicaciones" type="button"><i class="bi bi-geo-alt"></i> Ubicaciones</button></li>
                <li><button class="menu-btn" data-url="/crud_colaboradores" type="button"><i class="bi bi-people"></i> Colaboradores</button></li>
                <li><button class="menu-btn" data-url="/extensiones" type="button"><i class="bi bi-telephone"></i> Extensiones</button></li>
                <li><button class="menu-btn" data-url="/celulares" type="button"><i class="bi bi-phone"></i> Celulares</button></li>
                <li><button class="menu-btn" data-url="/correos" type="button"><i class="bi bi-envelope"></i> Correos</button></li>
                <li><button class="menu-btn" data-url="/vehiculos" type="button"><i class="bi bi-car-front"></i> Vehículos</button></li>
                <li><button class="menu-btn" data-url="/jerarquia" type="button"><i class="bi bi-diagram-3"></i> Jerarquía</button></li>
                <li><button class="menu-btn" data-url="/register" type="button"><i class="bi bi-person-plus"></i> Registrar</button></li>
            </ul>
        </div>
        <div class="workspace">
            <iframe class="module-frame" id="moduleFrame" src="/crud_areas" title="Contenido del módulo seleccionado"></iframe>
        </div>
    </div>
    <script>
        const moduleFrame = document.getElementById('moduleFrame');
        const moduleButtons = Array.from(document.querySelectorAll('.menu-btn[data-url]'));

        moduleButtons.forEach(function (button) {
            button.addEventListener('click', function () {
                moduleButtons.forEach(item => item.classList.remove('active'));
                button.classList.add('active');
                moduleFrame.src = button.dataset.url;
            });
        });

        // Mantener en el panel los CRUD al regresar al menú o cerrar sesión.
        moduleFrame.addEventListener('load', function () {
            try {
                const frameDocument = moduleFrame.contentDocument;
                frameDocument.querySelectorAll('a[href="/menu"], a[href="/logout"], a[href="/login"]').forEach(function (link) {
                    link.target = '_top';
                });
            } catch (error) {
                // Ignorar documentos externos o navegación temporal del iframe.
            }
        });
    </script>
</body>

</html>
