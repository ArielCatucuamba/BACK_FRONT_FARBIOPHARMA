<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include 'partials/proteccionSesion.html' %}
    <title>Menú Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            background: #f3f6fa;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            overflow: hidden;
        }
        .main-container {
            display: flex;
            height: 100vh;
            height: 100dvh;
            align-items: stretch;
            gap: 0;
            padding: 0;
        }
        .sidebar {
            background: #0d3b4e;
            border-radius: 0;
            width: 250px;
            min-width: 250px;
            padding: 1.25rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            box-shadow: 0 8px 28px rgba(13, 59, 78, 0.18);
            border: 0;
            height: 100vh;
            height: 100dvh;
            flex: 0 0 250px;
            overflow-y: auto;
        }
        .brand {
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: .02em;
            padding: .4rem .6rem 1.1rem;
        }
        .sidebar .logout-btn {
            background: #0d3b4e;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.65rem 1rem;
            font-weight: 600;
            font-size: .95rem;
            margin-bottom: 1rem;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(13, 59, 78, 0.08);
            transition: background 0.2s;
        }
        .sidebar .logout-btn:hover {
            background: #14506b;
        }
        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
            overflow-x: hidden;
        }
        .menu-list li {
            margin-bottom: 5px;
        }
        .menu-btn {
            width: 100%;
            background: none;
            border: none;
            text-align: left;
            padding: 10px 12px;
            font-size: .95rem;
            color: #fff;
            border-radius: 8px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.2s, color 0.2s;
        }
        .menu-btn.active,
        .menu-btn:hover {
            background: #14506b;
            color: #fff;
        }
        .workspace {
            position: relative;
            flex: 1;
            min-width: 0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f3f6fa;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }
        .module-frame {
            display: block;
            width: 100%;
            height: 100%;
            flex: 1 1 auto;
            min-height: 0;
            border: 0;
            background: #f3f6fa;
        }
        @media (max-width: 1024px) {
            .sidebar { flex-basis: 210px; width: 210px; min-width: 210px; padding: 1rem .75rem; }
            .menu-btn { padding: 9px 8px; font-size: .9rem; gap: 9px; }
        }
        @media (max-width: 640px) {
            .main-container { flex-direction: column; }
            .sidebar {
                flex: 0 0 auto;
                width: 100%;
                min-width: 0;
                height: auto;
                max-height: 76px;
                padding: 8px 10px;
                overflow: hidden;
            }
            .menu-list {
                display: flex;
                gap: 6px;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 2px 0 6px;
                scrollbar-width: thin;
                -webkit-overflow-scrolling: touch;
            }
            .menu-list li { flex: 0 0 auto; margin: 0; }
            .menu-btn {
                width: auto;
                min-height: 44px;
                padding: 8px 12px;
                white-space: nowrap;
                font-size: .84rem;
            }
            .workspace { flex: 1 1 auto; width: 100%; height: calc(100vh - 76px); height: calc(100dvh - 76px); min-height: 0; }
        }
        @media (max-width: 380px) {
            .sidebar { max-height: 68px; padding: 6px 8px; }
            .menu-btn { min-height: 42px; padding: 7px 10px; }
            .workspace { height: calc(100vh - 68px); height: calc(100dvh - 68px); }
        }
    </style>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/management-header.css', v='5') }}">
</head>

<body>
    <div class="main-container">
        <div class="sidebar">
            <ul class="menu-list">
                <li><button class="menu-btn active" data-url="/crud_areas" type="button"><i class="bi bi-diagram-3"></i> Áreas</button></li>
                <li><button class="menu-btn" data-url="/empresas" type="button"><i class="bi bi-buildings"></i> Empresas</button></li>
                <li><button class="menu-btn" data-url="/departamentos" type="button"><i class="bi bi-building"></i> Departamentos</button></li>
                <li><button class="menu-btn" data-url="/crud_cargos" type="button"><i class="bi bi-person-badge"></i> Cargos</button></li>
                <li><button class="menu-btn" data-url="/ubicaciones" type="button"><i class="bi bi-geo-alt"></i> Ubicaciones</button></li>
                <li><button class="menu-btn" data-url="/crud_colaboradores" type="button"><i class="bi bi-people"></i> Colaboradores</button></li>
                <li><button class="menu-btn" data-url="/extensiones" type="button"><i class="bi bi-telephone"></i> Extensiones</button></li>
                <li><button class="menu-btn" data-url="/celulares" type="button"><i class="bi bi-phone"></i> Celulares</button></li>
                <li><button class="menu-btn" data-url="/correos" type="button"><i class="bi bi-envelope"></i> Correos</button></li>
                <li><button class="menu-btn" data-url="/vehiculos" type="button"><i class="bi bi-car-front"></i> Vehículos</button></li>
                <li><button class="menu-btn" data-url="/jerarquia" type="button"><i class="bi bi-diagram-3"></i> Jerarquía</button></li>
                <li><button class="menu-btn" data-url="/sso/navew/organigrama" type="button"><i class="bi bi-diagram-2"></i> Organigrama</button></li>
            </ul>
        </div>
        <div class="workspace">
            {% with header_context = true %}
                {% include 'partials/management_header.html' %}
            {% endwith %}
            <iframe class="module-frame" id="moduleFrame" src="/crud_areas" title="Contenido del módulo seleccionado"></iframe>
        </div>
    </div>
    <script>
        const moduleFrame = document.getElementById('moduleFrame');
        const moduleButtons = Array.from(document.querySelectorAll('.menu-btn[data-url]'));

        moduleButtons.forEach(function (button) {
            button.addEventListener('click', function () {
                moduleButtons.forEach(item => item.classList.remove('active'));
                button.classList.add('active');
                const esOrganigrama = button.dataset.url === '/sso/navew/organigrama';
                document.querySelector('.workspace').classList.toggle('has-context-header', esOrganigrama);
                moduleFrame.src = button.dataset.url;
            });
        });

        // Mantener en el panel los CRUD al regresar al menú o cerrar sesión.
        moduleFrame.addEventListener('load', function () {
            try {
                const frameDocument = moduleFrame.contentDocument;
                if (moduleFrame.contentWindow.location.pathname === '/menu') {
                    window.top.location.replace('/menu');
                    return;
                }
                frameDocument.querySelectorAll('a[href="/menu"], a[href="/logout"], a[href="/login"]').forEach(function (link) {
                    link.target = '_top';
                });
            } catch (error) {
                // Ignorar documentos externos o navegación temporal del iframe.
            }
        });
    </script>
</body>

</html>
